[project]
name = "mock-erp"
version = "0.1.0"
description = "TradeDoc AI Mock ERP Service"
authors = [
    { name = "li", email = "li2350062418@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "motor>=3.3.2",
    "pymongo>=4.6.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

