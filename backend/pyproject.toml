[project]
name = "backend"
version = "0.1.0"
description = "TradeDoc AI Backend Service"
authors = [
    { name = "li", email = "li2350062418@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "motor>=3.3.2",
    "pymilvus>=2.4.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.2",
    "pandas>=2.2.0",
    "pymupdf>=1.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]


